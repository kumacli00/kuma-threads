<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>今日のThreads候補</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>/* ============================================================
   クマクリ ダッシュボード 共通スタイル（全ページの土台）

   どの gen_*.py も、まずこのファイルを <style> に展開してから
   ページ固有の CSS を後ろに足す。順番が意味を持つので入れ替えないこと。

   ■ 2つの見た目（参考画像に合わせて 2026-09-15 に決めた）
     1. 明るい管理画面（既定）
        薄いグレーの地に白いタイル。数字は色つきで大きく。
        上に .topbar があるページ（業務・経営・ネタ・議事録・KPI）は
        .topbar が左の濃い色のサイドバーになる（ナビ・検索・絞り込みはそこに入る）。
     2. ダークの光る版（<html class="theme-glow">）
        紺の地に紫〜オレンジの光。診断レポート4本（IG / X / TikTok / YouTube）で使う。
        色トークンを丸ごと差し替えているだけなので、部品のクラスは共通。

   ■ 書体
     見出し・本文・数字すべてゴシック（Noto Sans JP）。明朝は使わない（読みにくい）。
     等幅（IBM Plex Mono）はコードだけ。

   ■ 旧変数の別名
     各ページの古い CSS（--plane / --card / --s1 など）がそのまま動くよう、
     末尾で新しい色に橋渡ししている。新しく書く CSS は新しい名前を使うこと。
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap');

:root{
  color-scheme:light;
  --ground:#EEF1F5;
  --surface:#FFFFFF;
  --surface-2:#F4F6F9;
  --ink:#1E2430;
  --ink-soft:#586273;
  --ink-faint:#76808F;
  --rule:#E2E6EC;
  --rule-soft:#EDF0F4;
  --zebra:#F8FAFC;
  /* 主色：ティール（道具・肯定） */
  --accent:#149E9B;
  --accent-soft:#DCF3F2;
  --accent-ink:#0F7D7A;
  /* 副色：紫（診断・強調） */
  --kuma:#7C5CFF;
  --kuma-soft:#ECE7FF;
  --kuma-ink:#5A3FE0;
  /* 状態 */
  --warn:#E14B50;
  --warn-soft:#FDE8E9;
  --good:#2FB36A;
  --good-soft:#E2F6EA;
  --gold:#D99A00;
  --gold-soft:#FFF3D1;
  /* タイルの数字を順に塗る色（参考画像2の色つき数字） */
  --n1:#1E2430;--n2:#2FB36A;--n3:#E14B50;--n4:#149E9B;--n5:#7C5CFF;--n6:#F08A24;
  /* サイドバー */
  --side:#20434E;
  --side-2:#183740;
  --side-ink:rgba(255,255,255,.78);
  --shadow:0 1px 2px rgba(30,36,48,.04),0 10px 30px rgba(30,36,48,.06);
  --r:14px;
  --glow:linear-gradient(90deg,#7C5CFF,#FF7A59);
  --display:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
/* ---- ダークの光る版（診断レポート） ---- */
html.theme-glow{
  color-scheme:dark;
  --ground:#0F1326;
  --surface:#171C35;
  --surface-2:#1F2544;
  --ink:#EEF0FA;
  --ink-soft:#B5BBD4;
  --ink-faint:#8A92B0;
  --rule:#2B3358;
  --rule-soft:#242B4C;
  --zebra:rgba(255,255,255,.025);
  --accent:#FF7A59;
  --accent-soft:rgba(255,122,89,.16);
  --accent-ink:#FF9E86;
  --kuma:#A66CFF;
  --kuma-soft:rgba(166,108,255,.18);
  --kuma-ink:#C7A4FF;
  --warn:#FF5C7A;
  --warn-soft:rgba(255,92,122,.16);
  --good:#3FE0A6;
  --good-soft:rgba(63,224,166,.14);
  --gold:#FFC857;
  --gold-soft:rgba(255,200,87,.16);
  --n1:#EEF0FA;--n2:#3FE0A6;--n3:#FF7A59;--n4:#5AD8FF;--n5:#C7A4FF;--n6:#FFC857;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:15.5px;line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
html.theme-glow body{
  background:var(--ground);
  background-image:
    radial-gradient(60% 40% at 15% 0%,rgba(124,92,255,.35),transparent 60%),
    radial-gradient(45% 35% at 90% 5%,rgba(255,122,89,.28),transparent 60%),
    radial-gradient(50% 40% at 60% 100%,rgba(90,216,255,.10),transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;text-wrap:balance;letter-spacing:-.005em;line-height:1.4;color:var(--ink)}
a{color:var(--accent-ink)}
b,strong{font-weight:700;color:var(--ink)}
code,kbd{font-family:var(--code);font-size:.9em;background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:4px;padding:1px 5px}
.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}

/* ---- ページ幅 ---- */
.wrap{max-width:960px;margin:0 auto;padding:0 24px 88px}

/* ---- マストヘッド（レポート型・日次道具） ----
   <header>
     <span class="karte">Instagram 診断</span>   ← 小さな札になる
     <div class="eyebrow">…</div> <h1>…</h1> <p class="lede">…</p> <div class="provenance">…</div>
   </header> */
header{position:relative;padding:44px 0 26px;margin:0 0 26px;border-bottom:1px solid var(--rule)}
header > h1{font-size:32px;margin:0 0 16px;line-height:1.4;font-weight:900;letter-spacing:-.01em}
.karte{
  display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.12em;
  padding:4px 12px;border-radius:999px;margin:0 0 14px;
  color:#fff;background:var(--kuma);
}
.karte.tool{background:var(--accent)}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin:0 0 10px}
.lede{font-size:16px;color:var(--ink-soft);max-width:64ch;margin:0 0 6px;line-height:1.85}
.provenance{margin-top:20px;font-size:12.5px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:6px 20px;font-variant-numeric:tabular-nums}
.provenance span{white-space:nowrap}
/* 光る版：見出しの下に光の線 */
html.theme-glow header{border-bottom:0;padding-top:52px}
html.theme-glow header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--glow)}
html.theme-glow .karte{background:var(--glow);color:#fff}
html.theme-glow header > h1{font-size:34px;color:#fff;text-shadow:0 2px 24px rgba(124,92,255,.35)}
html.theme-glow .eyebrow{color:var(--kuma-ink)}

/* ---- アプリ型（左サイドバー） ----
   <div class="topbar">
     <header class="app">
       <span class="karte tool">業務ナレッジ</span>
       <div class="app-t"><h1>…</h1><div class="sub">…</div></div>
     </header>
     <nav class="tabs"><button class="tab active">…</button>…</nav>
     （#searchbar / .controls などもこの中に入れてよい）
   </div>
   <main>…</main>
   広い画面では .topbar が左の縦長サイドバーに、狭い画面では上の帯になる。 */
body:has(> .topbar){display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;align-items:start}
body:has(> .topbar) > main,body:has(> .topbar) > .wrap{grid-column:2;min-width:0}
.topbar{
  grid-column:1;grid-row:1 / span 20;position:sticky;top:0;height:100vh;overflow:auto;
  background:var(--side);background-image:linear-gradient(180deg,var(--side),var(--side-2));
  color:#fff;display:flex;flex-direction:column;gap:6px;padding:18px 14px 24px;
  scrollbar-width:thin;
}
header.app{border:0;padding:6px 8px 14px;margin:0;display:block;border-bottom:1px solid rgba(255,255,255,.12)}
header.app > .karte{
  display:inline-block;background:rgba(255,255,255,.14);color:#fff;
  font-size:10.5px;letter-spacing:.14em;padding:3px 10px;border-radius:999px;margin:0 0 12px;
}
header.app h1{font-size:18px;margin:0;line-height:1.35;font-weight:900;color:#fff}
header.app .sub{color:var(--side-ink);font-size:12px;margin-top:6px;line-height:1.6;font-variant-numeric:tabular-nums}
nav.tabs,nav.index{display:flex;flex-direction:column;gap:2px;padding:8px 0 4px}
nav.tabs .tab,nav.index .tab{
  appearance:none;border:0;background:transparent;color:var(--side-ink);cursor:pointer;text-align:left;
  font-family:var(--body);font-size:14px;font-weight:700;padding:10px 12px;border-radius:9px;
  text-decoration:none;line-height:1.4;display:flex;align-items:center;gap:10px;
}
nav.tabs .tab::before,nav.index .tab::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);flex:none}
nav.tabs .tab:hover,nav.index .tab:hover{background:rgba(255,255,255,.08);color:#fff}
nav.tabs .tab.active,nav.index .tab.active{background:#fff;color:var(--side);box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav.tabs .tab.active::before,nav.index .tab.active::before{background:var(--accent)}
/* サイドバーの中の検索・絞り込み（work の #searchbar、neta の .controls） */
.topbar #searchbar,.topbar .controls{padding:10px 6px 4px;background:transparent;border:0;display:block}
.topbar input[type=search],.topbar input[type=text],.topbar #searchbar input,.topbar #kw{
  width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;
  border-radius:9px;padding:9px 12px;font:inherit;font-size:13.5px;outline:none;
}
.topbar input::placeholder{color:rgba(255,255,255,.5)}
.topbar input:focus,.topbar #searchbar input:focus,.topbar #kw:focus{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
.topbar #searchinfo,.topbar .findhint{display:block;color:var(--side-ink);font-size:12px;margin-top:6px}
.topbar .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.topbar .chip{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--side-ink);
  padding:4px 10px;border-radius:999px;font-size:12px;cursor:pointer;font-weight:700;font-family:var(--body);
}
.topbar .chip:hover{background:rgba(255,255,255,.12);color:#fff}
.topbar .chip.active{background:#fff;color:var(--side);border-color:#fff}
main{padding:28px 32px 80px}
@media (max-width:900px){
  body:has(> .topbar){display:block}
  .topbar{position:sticky;top:0;z-index:10;height:auto;max-height:none;overflow:visible;grid-row:auto;padding:12px 14px 10px;gap:4px}
  header.app{display:flex;align-items:center;gap:12px;padding:0 0 8px}
  header.app > .karte{margin:0}
  header.app h1{font-size:16px}
  header.app .sub{display:none}
  nav.tabs,nav.index{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:4px 0 2px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar,nav.index::-webkit-scrollbar{display:none}
  nav.tabs .tab,nav.index .tab{padding:7px 12px;font-size:13px;white-space:nowrap}
  nav.tabs .tab::before,nav.index .tab::before{display:none}
  .topbar .chips{margin-top:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  main{padding:18px 16px 70px}
}

/* ---- 節見出し ---- */
section{margin-top:56px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-top:6px}
.sec-num{font-size:12px;font-weight:900;color:#fff;background:var(--kuma);letter-spacing:.06em;flex:none;padding:3px 10px;border-radius:999px;line-height:1.5;font-variant-numeric:tabular-nums}
html.theme-glow .sec-num{background:var(--glow)}
h2{font-size:24px;margin:0;font-weight:900}
.sec-sub{color:var(--ink-soft);margin:8px 0 24px;max-width:64ch;font-size:15px}
h3{font-size:17px;margin:24px 0 8px}
p{margin:0 0 18px}

/* ---- カード ---- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px;margin:16px 0;box-shadow:var(--shadow)}
html.theme-glow .card{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09);backdrop-filter:blur(8px)}

/* ---- 数字タイル（白いタイル・色つきの数字） ---- */
.stats,.kpis,.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:26px 0;background:none;border:0}
.stat,.kpis>.kpi,.kpi-grid>.kpi{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px 20px 18px;margin:0;
  box-shadow:var(--shadow);position:relative;min-width:0;
}
html.theme-glow .stat,html.theme-glow .kpis>.kpi,html.theme-glow .kpi-grid>.kpi{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09)}
.stat .k,.kpi .label,.kpi-label{font-size:12px;color:var(--ink-faint);letter-spacing:.02em;margin-bottom:10px;line-height:1.5;font-weight:700}
.stat .v,.kpi .val,.kpi-val{font-size:34px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:0;color:var(--n1)}
.stat .n,.kpi .note,.kpi-sub{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.55}
.stat:nth-child(6n+2) .v,.kpi:nth-child(6n+2) .val,.kpi:nth-child(6n+2) .kpi-val{color:var(--n2)}
.stat:nth-child(6n+3) .v,.kpi:nth-child(6n+3) .val,.kpi:nth-child(6n+3) .kpi-val{color:var(--n3)}
.stat:nth-child(6n+4) .v,.kpi:nth-child(6n+4) .val,.kpi:nth-child(6n+4) .kpi-val{color:var(--n4)}
.stat:nth-child(6n+5) .v,.kpi:nth-child(6n+5) .val,.kpi:nth-child(6n+5) .kpi-val{color:var(--n5)}
.stat:nth-child(6n+6) .v,.kpi:nth-child(6n+6) .val,.kpi:nth-child(6n+6) .kpi-val{color:var(--n6)}
.v.warn,.val.warn,.stat .v.warn{color:var(--warn)!important} .v.good,.val.good,.stat .v.good{color:var(--good)!important} .v.acc,.val.acc{color:var(--accent)!important}

/* ---- ファネル ---- */
.funnel{display:flex;flex-direction:column;gap:10px;margin:26px 0}
.fstep{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 20px;flex-wrap:wrap;box-shadow:var(--shadow)}
html.theme-glow .fstep{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09)}
.fbar{height:26px;background:var(--glow);flex:none;border-radius:8px;min-width:4px;max-width:100%}
.fmeta{flex:1;min-width:0}
.fname{font-size:14.5px;font-weight:700}
.fnote{font-size:12.5px;color:var(--ink-faint);line-height:1.6}
.fval{font-size:22px;font-weight:900;flex:none;font-variant-numeric:tabular-nums}
.fstep.est{border-style:dashed}
.fstep.est .fbar{background:var(--ink-faint);opacity:.5}

/* ---- 良い点リスト ---- */
.good-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:26px 0}
.good-item{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
html.theme-glow .good-item{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09)}
.good-item h3{font-size:15px;margin:0 0 8px;font-weight:700}
.good-item h3::before{content:"✓";color:var(--good);margin-right:8px;font-weight:900}
.good-item p{font-size:13.5px;color:var(--ink-soft);margin:0}

/* ---- 表 ---- */
.tw{overflow-x:auto;margin:26px 0;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
html.theme-glow .tw{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.09)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--rule-soft);vertical-align:top}
thead th{background:var(--surface-2);font-size:12px;letter-spacing:.03em;color:var(--ink-soft);font-weight:700;border-bottom:1px solid var(--rule);white-space:nowrap}
html.theme-glow thead th{background:rgba(255,255,255,.05)}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
tr.hi td{background:var(--kuma-soft)!important}
tr.lo td{background:var(--warn-soft)!important}

/* ---- 目次 ---- */
.toc{margin:28px 0 0;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
html.theme-glow .toc{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.09)}
.toc-head,.toc>h2,.toc>b{display:block;padding:12px 20px;border-bottom:1px solid var(--rule);font-size:13px;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;margin:0}
.toc ol{list-style:none;margin:0;padding:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:0;columns:auto}
.toc li{margin:0;font-size:14.5px;break-inside:avoid}
.toc a{display:flex;gap:12px;align-items:baseline;padding:7px 20px;color:var(--ink);text-decoration:none;line-height:1.6}
.toc a:hover{background:var(--surface-2);color:var(--accent-ink)}
.toc .tn{font-size:12px;font-weight:900;color:var(--kuma-ink);flex:none;min-width:2.2em;font-variant-numeric:tabular-nums}
@media (max-width:640px){.toc ol{grid-template-columns:1fr}}

/* ---- 先頭へ戻る ---- */
.to-top,.to-toc{
  position:fixed;right:16px;bottom:16px;z-index:50;display:none;align-items:center;gap:7px;
  padding:10px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);
  box-shadow:var(--shadow);color:var(--ink);text-decoration:none;font:inherit;font-size:13px;font-weight:700;line-height:1;cursor:pointer;
}
.to-top.is-on,.to-toc.is-on{display:inline-flex}
.to-top:hover,.to-toc:hover{color:var(--accent-ink);border-color:var(--accent)}

/* ---- 札（タグ・状態） ---- */
.tag,.badge,.pill,.chip{font-family:var(--body);font-weight:700;border-radius:999px}

/* ---- ボタン ---- */
button{font-family:var(--body)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--body);font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft)}

/* ---- 畳む ---- */
details>summary{cursor:pointer}
details>summary::-webkit-details-marker{display:none}

/* ---- 注記の帯 ---- */
.callout,.note-box{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;margin:14px 0;font-size:14px;color:var(--ink-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft);color:var(--ink)}

/* ---- 印刷 ---- */
@media print{
  body{background:#fff}
  .to-top,.to-toc{display:none!important}
  .topbar{position:static;height:auto}
}

/* ---- 動きを抑える ---- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ---- 狭い画面 ---- */
@media (max-width:640px){
  .wrap{padding:0 16px 64px}
  header{padding:26px 0 20px;margin-bottom:22px}
  header > h1{font-size:26px;overflow-wrap:anywhere}
  html.theme-glow header > h1{font-size:27px}
  h2{font-size:21px}
  .stat .v,.kpi .val,.kpi-val{font-size:28px}
  .stats,.kpis,.kpi-grid{gap:10px;grid-template-columns:repeat(2,1fr)}
  th,td{padding:9px 11px}

  /* 今日のThreads候補（道具のページ）

<script>(function () {
  const S = JSON.parse(document.getElementById("state").textContent);
  const LIMIT = S.limit || 500;
  // 所属ドクターのページ（kuma-threads/ito/ など）は保存の名前を分ける。同じ kumacli00.github.io の下は
  // 保存場所が共通なので、分けないと毛利先生のページと合言葉・記録が混ざる。毛利先生のページは今までの名前のまま
  const KEY = S.storeKey || "kuma-threads-state";
  // 合言葉の入力は出さない（2026-10-19 比嘉さん「合言葉必要なしにして」）。
  // 先生用のリンク（#k=…）で開いた端末だけ合言葉を覚え、本文を直して投稿できる（2026-10-24「投稿文編集できない」）。
  // 素のリンクで開いた人は、下書きそのままの本文だけ投稿できる（中継が pool.json の h と照合）。
  const PIN_KEY = S.pinKey || "kuma-threads-pin";
  let PIN = "";
  try {
    const m = /[#&]k=([0-9A-Za-z_-]{4,32})/.exec(location.hash || "");
    if (m) localStorage.setItem(PIN_KEY, m[1]);
    PIN = localStorage.getItem(PIN_KEY) || "";
  } catch (e) {}
  const CAN_EDIT = !PIN || true;   // 欄はいつでも直せる。直した本文を通せるかは中継が決める（合言葉あり＝通る）
  const UNDO_MS = 8000;
  const app = document.getElementById("app");

  // 見送り・投稿の記録は端末のブラウザに置く（サーバーを持たないため）。
  // 中継で投稿した分は post.py --sync が Threads 本体から拾い、翌朝の「投稿済み」に出る。
  let marks = {};
  try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { marks = {}; }
  const put = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
  const edits = {};
  const undoing = new Map();
  // 2026-10-19 から両先生のページは中継を使わず（gen_page.py が relay を空で渡す）、X の候補ページと同じく
  // 「Threadsで投稿する」1つで Threads の作成画面を本文入りで開く。以下の INLINE（中継で投稿）の部品は、
  // 中継を使うページに戻すとき用に残している。
  // 中継があるページは、ボタンは「Threadsに投稿する」1つだけ（「アプリで開く」は出さない）。
  // ブラウザの確認ダイアログ（confirm／prompt）は使わず、確認はカードの中で聞く。
  // Works などアプリ内のブラウザではダイアログが出ず、押しても何も起きないことがあった。また投稿できても結果が
  // 下の方に小さく出るだけで、押しても変わらないように見えた。2つのボタンが紛らわしいとも言われた（2026-10-19 比嘉さん）。
  // 投稿できたらカードの場所に「✅ 投稿しました」と投稿へのリンクを残す
  const INLINE = !!S.relay;
  const asking = new Set();       // 投稿の確認を出しているカード
  const done = new Map();         // この画面で投稿できたカード → 投稿のURL
  const cardMsg = {};             // カードの中に出す一言（通信できなかった時など）
  let msg = "", msgErr = false;
  let offset = 0;

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n = v => Number(v || 0).toLocaleString("ja-JP");
  const st = it => (marks[it.id] && marks[it.id].s) || "open";
  const setSt = (it, s, extra) => { marks[it.id] = Object.assign({ s }, extra || {}); put(); };
  const draftOf = it => (it.id in edits ? edits[it.id] : (it.draft || ""));
  const intent = (it, text) =>
    "https://www.threads.com/intent/post?text=" + encodeURIComponent((text || "").trim() +
      (it.kind === "quote" && it.url ? "\n" + it.url : ""));
  // Threads の数え方に寄せる（絵文字などの4バイト文字は複数文字ぶん数えられる）
  const tlen = s => { let c = 0; for (const ch of s) c += ch.codePointAt(0) > 0xFFFF ? 2 : 1; return c; };

  const inPlay = i => st(i) === "open" || st(i) === "pending";
  const shownList = () => S.items.filter(i => inPlay(i) || undoing.has(i.id) || done.has(i.id));
  // B 勢いのある美容ニュース・C 型の転用（2026-11-02 X と同じ3枠。毛利先生だけ）
  const NEWS = S.news || [], KATA = S.kata || [];
  const ALL = () => S.items.concat(NEWS, KATA);
  const hasBC = !!(NEWS.length || KATA.length || S.newsAll || S.kataAll);
  function secHead(title, note, count) {
    return `<h2 class="sec-h">${esc(title)}<span class="sec-n">${count}件</span>${note ? `<span class="sec-note">${esc(note)}</span>` : ""}</h2>`;
  }
  function speedLine(it) {
    if (!it.speed) return "";
    return `<p class="speed">⚡ X で投稿から${esc(it.ageH)}時間で表示 ${n(it.impressions)}回（1時間に <b>${n(it.speed)}</b> 回）</p>`;
  }

  function localToday() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function updatedWord() {
    const m = /^(\d{1,2}):(\d{2})$/.exec(S.updatedAt || "");
    if (!m) return "";
    const h = +m[1], mi = m[2];
    const when = h < 12 ? "今朝" : (h < 18 ? "今日" : "昨夜");
    return `（${when}${h}時${mi === "00" ? "" : mi + "分"}）`;
  }
  function staleBanner() {
    if (S.updated === localToday()) return "";
    return `<div class="alert" role="alert">今朝の更新が届いていません。<br>
      この画面は <b>${esc(S.updated)}</b> に作られたもので、下の候補は今日のものではありません。</div>`;
  }

  function postedLog() {
    const rows = (S.posted || []).slice().reverse();
    if (!rows.length) return "";
    return `
      <details class="log">
        <summary>この10日に投稿したもの ${rows.length}本</summary>
        <p class="log-note">Threads 本体から取り込んだ実績です。同じ投稿を二度引用しないための控え。数字は取り込み時点のものです。</p>
        ${rows.map(r => {
          const ins = r.insights || {};
          return `<a class="log-row" href="${esc(r.url)}" target="_blank" rel="noopener">
            <span class="log-date">${esc(r.date)}</span>
            <b class="log-tag">${r.kind === "original" ? "投稿" : "引用"}</b>
            <span class="log-text">${esc((r.text || "").slice(0, 60))}</span>
            <span class="log-meta">${ins.views != null ? "表示 " + n(ins.views) + " ・ " : ""}いいね ${n(ins.likes)}</span>
          </a>`; }).join("")}
      </details>`;
  }

  function render() {
    const posted = ALL().filter(i => st(i) === "posted").length;
    const skipped = ALL().filter(i => st(i) === "skipped").length;
    const left = ALL().filter(inPlay).length;
    const rest = shownList();
    const shown = rest.slice(offset, offset + S.show);
    const more = rest.length - offset - shown.length;
    const newsShown = NEWS.filter(i => inPlay(i) || undoing.has(i.id) || done.has(i.id));
    const kataShown = KATA.filter(i => inPlay(i) || undoing.has(i.id) || done.has(i.id));
    const how = S.relay
      ? `「Threadsに投稿する」を押して、出てきた確認の「投稿する」を押すと、この下書きのまま<b>そのまま投稿されます</b>（引用候補は引用投稿として）。本文はこの画面では直せません（下書きのまま投稿されます）。`
      : `「Threadsで投稿する」を押すと Threads が別のタブで開き、本文が入った状態になります。そこで「投稿」を押すと投稿されます。直したいときは枠の中を書き換えてから押してください。`;

    app.innerHTML = `
      ${staleBanner()}
      <header>
        <span class="karte tool">Threads 候補</span>
        <p class="eyebrow">${esc(S.updated)} 更新${S.updated === localToday() ? updatedWord() : ""} ／ @${esc(S.handle)}</p>
        <h1>${esc(S.title || "今日のThreads候補")}</h1>
        <p class="sub">${hasBC
          ? `候補は X と同じ3つの枠で<b>10件</b>です。先頭は<b>いま X で流行っている型2件</b>（型の組み立てと、その型で書いた先生の投稿。ほかの下書きを直す土台にも）、次に<b>話題の候補4件</b>（X で伸びている投稿から、先生自身の投稿として）、<b>勢いのある美容ニュース4件</b>（いま伸びている途中の話題を Threads で先に）。無理にクマの話へ持っていく書き方はやめました。`
          : esc(S.intro || "クマの話題だけを集めています。上の1件は先生ご自身の投稿の下書き、その下は引用の候補です。")}${how} <b>1日${S.target}本</b>が目安です。</p>
        <div class="tally">
          <span class="chip ${posted >= S.target ? "on" : ""}">今日の投稿 ${posted}件 ／ 目標 ${S.target}件</span>
          <span class="chip">見送り ${skipped}件</span>
          <span class="chip">残り ${left}件</span>
        </div>
      </header>
      ${hasBC ? secHead("いま X で流行っている型", "この型を土台に、下の下書きを書き直すこともできます", kataShown.length) : ""}
      ${hasBC ? (kataShown.length ? kataShown.map(card).join("") : '<div class="done-note">今朝は型として使える投稿がありませんでした。</div>') : ""}
      ${hasBC ? secHead("話題の候補", "X で伸びている投稿から。先生自身の投稿として書いてあります", shown.length) : ""}
      ${shown.length ? shown.map(card).join("")
        : '<div class="done-note">在庫がなくなりました。明朝また補充されます。</div>'}
      ${more > 0 ? `<button class="more" id="more">別の候補を見る（あと ${more} 件）</button>` : ""}
      ${offset > 0 ? `<button class="more" id="back">前の候補に戻る</button>` : ""}
      ${hasBC ? secHead("勢いのある美容ニュース", "X で48時間以内に表示が速く伸びている話題", newsShown.length) : ""}
      ${hasBC ? (newsShown.length ? newsShown.map(card).join("") : '<div class="done-note">今朝は勢いのある美容ニュースがありませんでした。</div>') : ""}
      <div class="status${msgErr ? " err" : ""}" id="status" role="status" aria-live="polite">${esc(msg)}</div>
      ${postedLog()}
      <div class="note">
        ${esc(S.note || "下書きは先生の過去の投稿の文体に合わせています（短く・1文ごとに改行・絵文字は1つまで・最後は問いかけ）。")}${LIMIT}字を超えると赤くなります。<br><br>
        この画面の記録（見送り・投稿）は<b>お使いの端末のブラウザに保存されます。</b>投稿した分は翌朝 Threads 本体から取り込んで「投稿したもの」に出ます。
      </div>`;
    shown.forEach(bind);
    newsShown.forEach(bind);
    kataShown.forEach(bind);
    const mb = document.getElementById("more");
    if (mb) mb.onclick = () => { offset += S.show; render(); };
    const bb = document.getElementById("back");
    if (bb) bb.onclick = () => { offset = Math.max(0, offset - S.show); render(); };
  }

  function undoStrip(it) {
    return `<section class="card undone"><div class="undo-bar">
      <span class="undo-msg">見送りました<span class="undo-who">${esc(it.kind === "quote" ? "@" + it.author : (it.theme || it.kataName || it.tierName || ""))}</span></span>
      <button class="btn-undo" id="u${esc(it.id)}">戻す</button></div></section>`;
  }

  function doneStrip(it) {
    const url = done.get(it.id);
    return `<section class="card undone posted-now"><div class="undo-bar">
      <span class="undo-msg">✅ 投稿しました</span>
      ${url ? `<a class="btn-undo" href="${esc(url)}" target="_blank" rel="noopener">Threadsで見る</a>` : ""}</div>
      <p class="posted-text">${esc((draftOf(it) || "").slice(0, 60))}…</p></section>`;
  }


  function askBlock(it) {
    return `
          <div class="confirm">
            <p class="confirm-q">この本文で @${esc(S.handle)} から投稿します。よろしいですか？</p>
            ${cardMsg[it.id] ? `<p class="why err">${esc(cardMsg[it.id])}</p>` : ""}
            <div class="actions">
              <button class="btn-yes" id="c${esc(it.id)}">投稿する</button>
              <button class="btn-no" id="x${esc(it.id)}">やめる</button>
            </div>
          </div>`;
  }

  function card(it) {
    if (undoing.has(it.id)) return undoStrip(it);
    if (done.has(it.id)) return doneStrip(it);
    const pending = st(it) === "pending";
    const isBC = it.kind === "news" || it.kind === "kata";
    const isO = it.kind === "original" || isBC;
    const kata = it.kind === "kata";
    const m = marks[it.id] || {};
    const xSrc = `<div class="src"><div class="src-who"><b>X の元投稿</b>${it.sourceAuthor ? `<span>@${esc(it.sourceAuthor)}</span>` : ""}</div>
          <p class="src-text">${esc(it.sourceText || "")}</p>
          <a class="src-link" href="${esc(it.sourceUrl)}" target="_blank" rel="noopener">元の投稿を X で見る（別のタブ）→</a></div>`;
    return `
      <section class="card${pending ? " asking" : ""}${isO ? " original" : ""}${kata ? " kata-card" : ""}">
        <div class="card-h"><span class="tier">${esc(it.tierName || "")}</span>${
          it.kind === "news" ? (it.bridge ? `<span class="tier bridge">繋がる：${esc(it.bridgeWord)}</span>` : `<span class="tier nobridge">繋がらないが勢いあり</span>`) : ""}${
          kata && it.kataName ? `<span class="tier kata">型：${esc(it.kataName)}</span>` : ""}${
          it.isNew ? `<span class="tier fresh">新着</span>` : `<span class="tier seen">昨日までの候補</span>`}${
          !isO && (it.source === "TOP" || (it.likes || 0) >= 100) ? `<span class="tier top">${it.source === "TOP" ? "人気順で上位" : "いいね100超"}</span>` : ""}${
          !isO && it.hasReplies ? `<span class="tier top">返信あり</span>` : ""}</div>
        ${speedLine(it)}
        ${kata ? `<div class="kata-box">
          ${it.kataName ? `<p class="kata-name">${esc(it.kataName)}</p>` : ""}
          ${it.mimic ? `<p class="kata-row"><b>型の組み立て（ここを真似る）</b>${esc(it.mimic)}</p>` : ""}
          ${it.kataWhy ? `<p class="kata-row"><b>なぜこの型が今伸びるか</b>${esc(it.kataWhy)}</p>` : ""}
          ${it.why ? `<p class="kata-row"><b>この型で書いた先生の投稿は</b>${esc(it.why)}</p>` : ""}
        </div><details class="kata-src"><summary>型の元になった投稿を見る（中身は真似していません）</summary>${xSrc}</details>` :
        it.kind === "news" ? `${it.why ? `<div class="src"><p class="why">${esc(it.why)}</p></div>` : ""}${xSrc}` :
        it.why ? `<div class="src"><p class="why">${esc(it.why)}</p></div>` : ""}
        ${isBC ? "" : isO ? `<div class="src"><p class="topic"><b>${esc(it.theme)}</b>${esc(it.angle)}</p>${
          it.sourceUrl ? `<p class="src-text">${esc(it.sourceText || "")}</p>
          <a class="src-link" href="${esc(it.sourceUrl)}" target="_blank" rel="noopener">元ネタ（X・表示 ${n(it.impressions)}）を見る →</a>` : ""}</div>` : `
        <div class="src">
          <div class="src-who"><b>@${esc(it.author)}</b><span>${esc(it.date)}</span>${
            it.likes != null ? `<span>♥ ${n(it.likes)}</span><span>💬 ${n(it.replies)}</span>` : ""}${
            it.stale ? `<span class="tier stale">やや前の投稿</span>` : ""}</div>
          <p class="src-text">${esc(it.text)}</p>
          <a class="src-link" href="${esc(it.url)}" target="_blank" rel="noopener">元の投稿をThreadsで見る（別のタブ）→</a>
        </div>`}
        <div class="draft">
          <div class="draft-label">${kata ? "先生の単発投稿（下書き）" : isO ? "投稿の下書き" : "引用の本文"}<span class="count" id="n${esc(it.id)}"></span></div>
          <textarea id="t${esc(it.id)}" aria-label="下書き" rows="1">${esc(draftOf(it))}</textarea>
          ${INLINE && asking.has(it.id) ? askBlock(it) : pending ? `
          <div class="confirm">
            <p class="confirm-q">Threads の画面で「投稿」を押しましたか？</p>
            <div class="actions">
              <button class="btn-yes" id="y${esc(it.id)}">投稿しました</button>
              <button class="btn-no" id="w${esc(it.id)}">まだ／やめました</button>
            </div>
          </div>` : `
          <div class="actions">
            ${S.relay ? `<button class="btn-post" id="p${esc(it.id)}">Threadsに投稿する</button>` : ""}
            ${INLINE ? "" : `<a class="btn btn-post" id="a${esc(it.id)}" href="${esc(it.intent)}" target="_blank" rel="noopener">Threadsで投稿する</a>`}
            <button class="btn-skip" id="k${esc(it.id)}">見送る</button>
          </div>
          ${!isO && !S.relay ? `<p class="why">※ 本文の下に元の投稿のリンクが付きます。</p>` : ""}`}
        </div>
      </section>`;
  }

  function grow(ta) {
    if (!ta.clientWidth) return;
    ta.style.height = "auto";
    const frame = ta.offsetHeight - ta.clientHeight;
    ta.style.height = (ta.scrollHeight + frame) + "px";
  }
  let lastW = -1;
  function resizeAll(force) {
    const w = app.clientWidth;
    if (!force && w === lastW) return;
    lastW = w;
    document.querySelectorAll("textarea").forEach(grow);
  }

  // 合言葉入りのリンク（#k=…）は URL に残したままにする。Works や LINE の中のブラウザは開くたびに保存が消えることがあり、
  // 「一度覚える」が効かなかった（2026-10-24 先生がエラー）。リンクに付いていれば、どこから開いても毎回効く

  async function postViaRelay(it, text, btn) {
    btn.disabled = true; btn.textContent = "投稿しています…";
    msg = ""; msgErr = false;
    try {
      const r = await fetch(S.relay, { method: "POST", redirect: "follow",
        body: JSON.stringify(Object.assign({ action: "post", id: it.id, kind: it.kind || "quote", text },
          PIN ? { pin: PIN } : {}, S.account ? { account: S.account } : {})) });
      const j = await r.json();
      // 結果はカードの中に出す（下の方の一行だと押しても何も起きないように見える）
      if (j.ok || j.error === "already") {
        setSt(it, "posted", { url: j.url || "" });
        done.set(it.id, j.url || ""); asking.delete(it.id); delete cardMsg[it.id];
      } else if (j.error === "edited") cardMsg[it.id] = PIN
        ? "下書きが新しくなっています。再読み込みしてから押してください。"
        : "このリンクからは本文を直して投稿できません。Works に貼ってある先生用のリンクから開き直して、もう一度押してください。";
      else if (j.error === "pin") cardMsg[it.id] = "このリンクの合言葉が古いようです。広報に新しいリンクをもらってください。";
      else if (j.error === "unknown_id") cardMsg[it.id] = "この候補は今日のページに無いものです。再読み込みしてください。";
      else cardMsg[it.id] = "投稿できませんでした：" + (j.message || j.error || "不明なエラー");
    } catch (e) {
      cardMsg[it.id] = "通信できませんでした。電波のよい所でもう一度押してください。";
    }
    render();
  }

  function bind(it) {
    if (undoing.has(it.id)) {
      const ub = document.getElementById("u" + it.id);
      if (ub) ub.onclick = () => {
        clearTimeout(undoing.get(it.id)); undoing.delete(it.id);
        delete marks[it.id]; put(); msg = "見送りを取り消しました。"; msgErr = false; render();
      };
      return;
    }
    if (done.has(it.id)) return;     // 投稿できたカード（本文の欄もボタンも無い）
    const ta = document.getElementById("t" + it.id);
    const cnt = document.getElementById("n" + it.id);
    const appLink = document.getElementById("a" + it.id);
    const upd = () => {
      edits[it.id] = ta.value;
      const len = tlen(ta.value);
      cnt.textContent = len + " / " + LIMIT + "字";
      cnt.classList.toggle("over", len > LIMIT);
      if (appLink) appLink.href = intent(it, ta.value);
      grow(ta);
    };
    ta.addEventListener("input", upd); upd();

    const pb = document.getElementById("p" + it.id);
    // 送る本文は下書きそのまま（中継が下書きと照合する。欄は読むだけ）
    const body = () => ta.value.trim();
    if (pb) pb.onclick = () => {
      const text = body();
      if (!text) { cardMsg[it.id] = "本文が空です。"; asking.add(it.id); render(); return; }
      if (tlen(text) > LIMIT) { cardMsg[it.id] = LIMIT + "字を超えています。"; asking.add(it.id); render(); return; }
      delete cardMsg[it.id]; asking.add(it.id); render();
    };
    const cb = document.getElementById("c" + it.id);
    if (cb) cb.onclick = () => {
      const text = body();
      if (!text || tlen(text) > LIMIT) { cardMsg[it.id] = !text ? "本文が空です。" : LIMIT + "字を超えています。"; render(); return; }
      delete cardMsg[it.id];
      postViaRelay(it, text, cb);
    };
    const xb = document.getElementById("x" + it.id);
    if (xb) xb.onclick = () => { asking.delete(it.id); delete cardMsg[it.id]; render(); };
    if (appLink) appLink.onclick = () => { setSt(it, "pending"); setTimeout(render, 400); };
    const yes = document.getElementById("y" + it.id);
    if (yes) yes.onclick = () => { setSt(it, "posted"); msg = "投稿として数えました。"; msgErr = false; render(); };
    const no = document.getElementById("w" + it.id);
    if (no) no.onclick = () => { delete marks[it.id]; put(); msg = "候補に戻しました。"; msgErr = false; render(); };
    const sk = document.getElementById("k" + it.id);
    if (sk) sk.onclick = () => {
      setSt(it, "skipped");
      undoing.set(it.id, setTimeout(() => { undoing.delete(it.id); render(); }, UNDO_MS));
      msg = "見送りました。数秒のあいだは「戻す」で取り消せます。"; msgErr = false; render();
    };
  }

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => resizeAll(true));
  addEventListener("load", () => resizeAll(true));
  addEventListener("resize", () => resizeAll(false));
  if (window.ResizeObserver) new ResizeObserver(() => resizeAll(false)).observe(app);
})();
</script>
</body></html>
