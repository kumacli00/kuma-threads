<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Threads 連携の確認コード</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f6f4ef;color:#1d1d1b;margin:0;padding:2rem 1rem;line-height:1.8}
  .box{max-width:34rem;margin:0 auto;background:#fff;border:1px solid #e3ded3;border-radius:14px;padding:1.5rem}
  h1{font-size:1.25rem;margin:0 0 .75rem}
  p{margin:.5rem 0;font-size:.95rem}
  code{display:block;word-break:break-all;background:#f0ede6;border-radius:10px;padding:.9rem;font-size:.9rem;margin:.75rem 0}
  button{font:inherit;font-weight:700;padding:.8rem 1.2rem;border-radius:10px;border:0;background:#2f6b4f;color:#fff;width:100%;font-size:1rem}
  .ok{color:#2f6b4f;font-weight:700}
  .err{color:#a33;font-weight:700}
</style></head><body>
<div class="box" id="app"></div>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  const app = document.getElementById("app");
  const esc = s => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  if (q.get("error")) {
    app.innerHTML = `<h1>連携は行われませんでした</h1><p class="err">${esc(q.get("error_description")||q.get("error"))}</p><p>もう一度やり直す場合は、広報から届いたリンクを開き直してください。</p>`;
    return;
  }
  const code = (q.get("code")||"").replace(/#_$/,"");
  if (!code) {
    app.innerHTML = `<h1>Threads 連携の確認コード</h1><p>このページは Threads の連携を許可したあとに開くページです。広報から届いたリンクを開いて「許可」を押すと、ここにコードが表示されます。</p>`;
    return;
  }
  app.innerHTML = `<h1>許可ありがとうございます</h1>
    <p>下のコードを<b>そのまま広報に送ってください</b>（1時間で無効になります。パスワードではありません）。</p>
    <code id="c">${esc(code)}</code>
    <button id="b">コードをコピー</button>
    <p id="m"></p>`;
  document.getElementById("b").onclick = async () => {
    const m = document.getElementById("m");
    try { await navigator.clipboard.writeText(code); m.textContent = "コピーしました。LINE や Works に貼って送ってください。"; m.className = "ok"; }
    catch (e) { m.textContent = "コピーできませんでした。上のコードを長押しして選択・コピーしてください。"; m.className = "err"; }
  };
})();
</script>
</body></html>
